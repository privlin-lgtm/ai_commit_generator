[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-commit-generator"
version = "0.5.0"
description = "Generate validated commit messages from Git diffs with local or remote LLM providers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI Commit Generator contributors" }]
keywords = ["git", "commit", "llm", "cli", "conventional-commits"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.8,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34,<1"]
all-providers = ["anthropic>=0.34,<1"]
dev = [
  "anthropic>=0.34,<1",
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
  "bandit>=1.7,<2",
  "build>=1.2,<2",
  "pip-audit>=2.7,<3",
]

[project.scripts]
commitgen = "ai_commit_generator.cli:main"



[tool.hatch.build.targets.wheel]
packages = ["src/ai_commit_generator"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=ai_commit_generator --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
