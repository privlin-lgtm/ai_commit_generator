[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-commit-generator"
version = "0.1.0"
description = "Generate Conventional Commit messages from Git diffs with OpenAI-compatible models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI Commit Generator contributors" }]
keywords = ["git", "commit", "openai", "cli", "conventional-commits"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "openai>=1.40,<3",
  "rich>=13.8,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
commitgen = "ai_commit_generator.cli:main"



[tool.hatch.build.targets.wheel]
packages = ["src/ai_commit_generator"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=ai_commit_generator --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
